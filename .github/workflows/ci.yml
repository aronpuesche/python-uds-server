name: CI

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pre_commit run --all-files
      - run: python -m pytest -m unit
      - run: python -m pytest -m integration

  package-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[docs]" build twine
      - run: python -m sphinx -W -b html docs docs/_build/html
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv .package-test
      - run: .package-test/bin/python -m pip install dist/*.whl
      - run: .package-test/bin/python -c "from uds_server import UdsServer; assert UdsServer"
